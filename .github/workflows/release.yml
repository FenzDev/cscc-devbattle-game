name: Release CSCCDevBattle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore ContentBuilder
        run: dotnet restore ContentBuilder/ContentBuilder.csproj

      - name: Restore game
        run: dotnet restore CSCCDevBattle/CSCCDevBattle.csproj -r win-x64

      - name: Publish Windows build
        run: dotnet publish CSCCDevBattle/CSCCDevBattle.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish

      - name: Package Windows release
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath CSCCDevBattle-win-x64.zip

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: CSCCDevBattle-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install ZIP utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Restore ContentBuilder
        run: dotnet restore ContentBuilder/ContentBuilder.csproj

      - name: Restore game
        run: dotnet restore CSCCDevBattle/CSCCDevBattle.csproj -r linux-x64

      - name: Publish Linux build
        run: dotnet publish CSCCDevBattle/CSCCDevBattle.csproj -c Release -r linux-x64 --self-contained true -o artifacts/publish

      - name: Package Linux release
        run: |
          cd artifacts/publish
          zip -r ../../CSCCDevBattle-linux-x64.zip .

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: CSCCDevBattle-linux-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CSCCDevBattle-win-x64.zip
            dist/CSCCDevBattle-linux-x64.zip
